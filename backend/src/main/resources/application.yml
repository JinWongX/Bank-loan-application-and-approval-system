server:
  port: 8080

jwt:
  secret: kZAE93bUKfaJLNQNF1hxJoRufLr72D8j

encryption:
  aes-key: JFeIyR9nYrHIMOxdSWCVPFSktRfsnr64

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  application:
    name: loan-system-backend
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${user.dir}/loan_system.db
  sql:
    init:
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      mode: always
      encoding: UTF-8
      continue-on-error: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-handlers-package: com.bank.loan.config
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    com.bank.loan.mapper: debug
